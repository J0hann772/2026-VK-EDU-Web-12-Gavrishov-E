<h3>Popular Tags</h3>
<div class="tags-cloud d-flex flex-wrap gap-2">
    {% for tag in popular_tags %}
        <a href="{{ tag.get_absolute_url }}" class="tag-small">{{ tag.name }}</a>
    {% empty %}
        <p class="text-muted mb-0">Тегов пока нет</p>
    {% endfor %}
</div>
<br>
<h3>Best Members</h3>
<div class="best-members d-flex flex-column gap-2">
    {% for member in best_members %}
        <span class="member-link">{{ member.profile.nickname|default:member.username }}</span>
    {% empty %}
        <p class="text-muted mb-0">Пользователей пока нет</p>
    {% endfor %}
</div>
