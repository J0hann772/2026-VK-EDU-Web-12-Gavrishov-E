<div class="question-item mb-4 container">
    <div class="row">
        <div class="col-md-2">
            <img src="{{ question.get_author_avatar_url }}" alt="avatar" class="question-avatar mb-2">
            <div class="custom-spinner">
                <input type="text" class="spinner-input" value="{{ question.rating }}" readonly>
                <div class="spinner-buttons">
                    <button type="button" class="spin-up">&#9650;</button>
                    <button type="button" class="spin-down">&#9660;</button>
                </div>
            </div>
        </div>
        <div class="col-md-10">
            <h4><a href="{{ question.get_absolute_url }}">{{ question.title }}</a></h4>
            <p class="text-question">{{ question.text }}</p>
            <div class="d-flex gap-4 flex-wrap">
                <a href="{{ question.get_absolute_url }}">answer ({{ question.answers_count }})</a>
                <p class="mb-0">Tags:
                    {% for tag in question.tags.all %}
                        <a href="{{ tag.get_absolute_url }}" class="link">{{ tag.name }}</a>
                    {% empty %}
                        <span class="text-muted">без тегов</span>
                    {% endfor %}
                </p>
                <span class="text-muted ms-auto">{{ question.get_author_name }}</span>
            </div>
        </div>
    </div>
</div>
