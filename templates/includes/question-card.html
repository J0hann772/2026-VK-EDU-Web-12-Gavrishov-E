<div class="question-item mb-4 container">
    <div class="row">
        <div class="col-md-2">
            <img src="{{ question.get_author_avatar_url }}" alt="avatar" class="question-avatar mb-2">
            <div class="custom-spinner js-vote-box">
                <input type="text" class="spinner-input js-rating-input" value="{{ question.rating }}" readonly>
                <div class="spinner-buttons">
                    {% if request.user.is_authenticated %}
                        <button
                            type="button"
                            class="spin-up js-vote-btn {% if question.user_vote == 1 %}active-vote{% endif %}"
                            data-url="{% url 'questions:like_question' %}"
                            data-param="question_id"
                            data-object-id="{{ question.id }}"
                            data-value="1"
                            {% if question.user_vote == 1 %}disabled title="Вы уже поставили лайк"{% else %}title="Поставить лайк"{% endif %}
                        >&#9650;</button>
                        <button
                            type="button"
                            class="spin-down js-vote-btn {% if question.user_vote == -1 %}active-vote{% endif %}"
                            data-url="{% url 'questions:like_question' %}"
                            data-param="question_id"
                            data-object-id="{{ question.id }}"
                            data-value="-1"
                            {% if question.user_vote == -1 %}disabled title="Вы уже поставили дизлайк"{% else %}title="Поставить дизлайк"{% endif %}
                        >&#9660;</button>
                    {% else %}
                        <button type="button" class="spin-up" disabled title="Войдите, чтобы оценивать вопросы">&#9650;</button>
                        <button type="button" class="spin-down" disabled title="Войдите, чтобы оценивать вопросы">&#9660;</button>
                    {% endif %}
                </div>
            </div>
        </div>
        <div class="col-md-10">
            <h4><a href="{{ question.get_absolute_url }}">{{ question.title }}</a></h4>
            <p class="text-question">{{ question.text }}</p>
            <div class="d-flex gap-4 flex-wrap">
                <a href="{{ question.get_absolute_url }}">answer ({{ question.answers_count }})</a>
                <p class="mb-0">Tags:
                    {% for tag in question.tags.all %}
                        <a href="{{ tag.get_absolute_url }}" class="link">{{ tag.name }}</a>
                    {% empty %}
                        <span class="text-muted">без тегов</span>
                    {% endfor %}
                </p>
                <span class="text-muted ms-auto">{{ question.get_author_name }}</span>
            </div>
        </div>
    </div>
</div>
