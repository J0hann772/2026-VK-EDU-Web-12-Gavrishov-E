<div class="container" style="margin-top: 20px;">
    <div class="header">
        <h2><a href="{% url 'questions:index' %}" class="logo-link">AskPupkin</a></h2>

        <div id="main-search">
            <input class="search-input" type="text" placeholder="Search" disabled title="Поиск появится в следующих заданиях">
            {% if request.user.is_authenticated %}
                <a href="{% url 'questions:ask' %}" class="btn-search text-decoration-none px-3 py-1">ASK!</a>
            {% else %}
                <button type="button" class="btn-search px-3 py-1" disabled title="Войдите, чтобы задать вопрос">ASK!</button>
            {% endif %}
        </div>

        <div class="user-info">
            {% if request.user.is_authenticated %}
                <img src="{{ current_user_avatar }}" alt="avatar" class="avatar">
                <div>
                    <div class="user-name fw-semibold">{{ current_user_name }}</div>
                    <div class="d-flex align-items-center gap-2">
                        <a href="{% url 'core:profile' %}">Settings</a>
                        <form action="{% url 'core:logout' %}" method="post" class="d-inline">
                            {% csrf_token %}
                            <input type="hidden" name="next" value="{{ request.get_full_path }}">
                            <button type="submit" class="btn btn-link p-0 align-baseline logout-btn">Log out</button>
                        </form>
                    </div>
                </div>
            {% else %}
                <a href="{% url 'core:login' %}?next={{ request.get_full_path|urlencode }}">Log in</a>
                <a href="{% url 'core:signup' %}">Register</a>
            {% endif %}
        </div>
    </div>
</div>
<hr class="hr">
