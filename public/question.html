<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Title</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="static/css/style.css">
</head>
<body>
    

    
    <main>
    
        <div class="container">
                <div class="header">
            <h2><a href="/" class="logo-link">AskPupkin</a></h2>
            <div id="main-search">
                <input class="search-input" type="text" name="username" placeholder="Search">
                <input type="submit" value="ASK!" class="btn-search">
            </div>
        </div>
        <hr class="hr">
            <div class="row">
                <h2 class="mb-3">New Question</h2>
                <div class="col-md-8">
                    <div class="row mb-3 align-items-center">
                        <label id = "default-text" for="exampleFormControlInput1" class="form-label col-sm-1 col-form-label">Title</label>
                        <div class="col-sm-11">
                            <input type="email" class="form-control col-sm-10 text-input-question" id="exampleFormControlInput1" placeholder="How to create a Django project?">
                        </div>
                        
                    </div>
                    <div class="row mb-3 align-items-center">
                        <label id = "default-text" for="exampleFormControlTextarea1" class="form-label col-sm-1">Text</label>
                        <div class="col-sm-11">
                            <textarea class="form-control text-input-question" id="exampleFormControlTextarea1" rows="3" placeholder="Enter your question here..."></textarea>
                        </div>
                        
                    </div>
                    <div class="row mb-3 align-items-center">
                        <label id = "default-text" for="exampleFormControlTextarea1" class="form-label col-sm-1">Tags</label>
                        <div class="col-sm-11">
                            <textarea class="form-control text-input-question" id="exampleFormControlTextarea1" rows="3" placeholder="Enter tags separated by commas..."></textarea>
                        </div>
                    </div>
                    <div class="row mb-3 align-items-center">
                        <div class="col-sm-1"></div>
                        <div class="col-sm-11">
                            <button type="button" class="btn-pagin">ASK!</button>
                        </div>
                    </div>
                </div>
                <div class="col-md-3 ms-auto">
                    <h3>Popular Tags</h3>
                    <div class="tags-cloud">
                        <a href="#" class="tag-small">perl</a>
                        <a href="#" class="tag-medium text-danger">python</a>
                        <a href="#" class="tag-small">TechnoPark</a>
                        <br>
                        <a href="#" class="tag-large text-danger">MySQL</a>
                        <a href="#" class="tag-large text-success">django</a> 
                        <br>
                        <a href="#" class="tag-small">Mail.Ru</a>
                        <a href="#" class="tag-small">Voloshin</a>
                        <a href="#" class="tag-small text-warning">Firefox</a>
                    </div>
                    <br>
                    <h3>Best Members</h3>
                    <div class="best-members d-flex flex-column gap-2">
                        <a href="#" class="member-link">John Doe</a>
                        <a href="#" class="member-link">Jane Smith</a>
                        <a href="#" class="member-link">Alice Johnson</a>
                        <a href="#" class="member-link">Bob Brown</a>
                        <a href="#" class="member-link">Charlie Davis</a>
                        <a href="#" class="member-link">Eve Wilson</a>
                    </div>
                </div> 
            </div> 
        </div> 
        
    </main>

    <footer>

    </footer>


</body>
</html>
