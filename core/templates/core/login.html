{% extends 'layouts/base.html' %}

{% block title %}Log In{% endblock %}

{% block content %}
    <div class="login-form">
        <div class="container">
            <div class="row">
                <h3>Log In</h3>
                <form action="{% url 'core:login' %}" method="post">
        {% csrf_token %}
                <p class="alert-warning">Sorry, wrong password</p>
                <div class="d-flex align-items-center m-3">
                    <div class="col-3">
                        <label for="username">Login</label>
                    </div>
                    <div class="col-9">
                        <input type="text" name="username" id="username" maxlength="30" placeholder="Enter Username">
                    </div>

                </div>
                <div class="d-flex align-content-center  m-3">

                    <div class="col-3">
                        <label for="password">Password</label>
                    </div>
                    <div class="col-6">
                        <input type="password" name="password" id="password" placeholder="Enter Password">
                        <div class="text-danger">Введите пароль</div>
                    </div>

                </div>
                <div class="col-3"></div>
                <div class="col-9 p-4">
                    <button type="submit" class="login-btn mb-3">Login</button>
                    <a href="{% url 'core:signup' %}" class="">create new account?</a>
                </div>
                </form>

            </div>
        </div>
    </div>
{% endblock %}
