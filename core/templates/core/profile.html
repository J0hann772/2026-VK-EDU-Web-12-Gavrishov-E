{% extends 'layouts/base.html' %}
{% load static %}

{% block title %}Settings{% endblock %}

{% block content %}
    <h2 class="mb-4">Settings: Dr. Pepper</h2>

    <!-- Обертка для всей формы -->
    <form class="settings-form" action="{% url 'core:profile' %}" method="post" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="alert alert-danger">Не удалось сохранить настройки, проверьте поля формы</div>

        <!-- 1. Поле Login -->
        <div class="row align-items-center mb-3">
            <div class="col-sm-3">
                <label class="form-label m-0" for="login">Login</label>
            </div>
            <div class="col-sm-6">
                <input class="form-control" type="text" id="login" name="login" maxlength="30" placeholder="dr_pepper" value="dr_pepper">
                <div class="form-text">До 30 символов</div>
            </div>
        </div>

        <!-- 2. Поле Email -->
        <div class="row align-items-center mb-3">
            <div class="col-sm-3">
                <label class="form-label m-0" for="email">Email</label>
            </div>
            <div class="col-sm-6">
                <input class="form-control is-invalid" type="email" id="email" name="email" placeholder="dr.pepper@mail.ru" value="dr.pepper@mail.ru">
                <div class="invalid-feedback">Введите корректный email</div>
            </div>
        </div>

        <!-- 3. Поле NickName -->
        <div class="row align-items-center mb-3">
            <div class="col-sm-3">
                <label class="form-label m-0" for="nickname">NickName</label>
            </div>
            <div class="col-sm-6">
                <input class="form-control" type="text" id="nickname" name="nickname" placeholder="Dr. Pepper" value="Dr. Pepper">
            </div>
        </div>

        <!-- 4. Секция загрузки аватара -->
        <div class="row mb-3">
            <div class="col-sm-3">
                <label class="form-label pt-2" for="avatar-input">Upload avatar</label>
            </div>
            <div class="col-sm-6">
                <!-- Сама картинка аватара -->
                <div class="mb-2">
                    <img src="{% static 'core/img/author1.png' %}" alt="avatar" class="img-thumbnail" style="width: 100px; height: 100px; object-fit: cover;">
                </div>
                <!-- Стандартная кнопка выбора файла в стиле Bootstrap -->
                <input class="form-control" type="file" id="avatar-input" name="avatar">
            </div>
        </div>

        <!-- 5. Кнопка Save -->
        <div class="row mt-4">
            <div class="col-sm-3"></div> <!-- Пустая колонка для сдвига кнопки -->
            <div class="col-sm-6">
                <button type="submit" class="btn-pagin  px-4">Save</button>
            </div>
        </div>

    </form>
{% endblock %}
